# Install root:root mode 0644 as /etc/tmpfiles.d/ogfi-deploy.conf.
d /run/ogfi-deploy 0750 root root -
f /run/ogfi-deploy/release-session.lock 0640 root root -
d /var/spool/ogfi-release 0710 root ogfi-deploy -
d /var/spool/ogfi-release/incoming 0730 root ogfi-deploy 1d
d /var/spool/ogfi-release/admitted 0700 root root -
d /var/lib/ogfi/release-state 0700 root root -
d /var/lib/ogfi/release-evidence 0750 root ogfi-deploy -
d /opt/ogfi/releases 0755 root root -
