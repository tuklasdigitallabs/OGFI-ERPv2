name: ogfi-production-auth-e2e

services:
  caddy:
    build:
      context: ../../..
      dockerfile: infra/caddy/Dockerfile
      args:
        CADDY_BUILDER_IMAGE: docker.io/library/caddy:2.11.4-builder-alpine@sha256:8e89605351333ad2cc2f3bcc95275a2ccc427f88914050e86a5fde0fd77a63c4
        CADDY_RUNTIME_IMAGE: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]

  nginx:
    image: docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    tmpfs:
      - /var/cache/nginx:size=8m,mode=1777
      - /var/run:size=1m,mode=1777
    volumes:
      - type: bind
        source: ./nginx.conf.template
        target: /etc/nginx/nginx.conf
        read_only: true
    secrets:
      - source: ogfi_production_auth_e2e_tls_cert
        target: ogfi_production_auth_e2e_tls_cert
        mode: 0444
      - source: ogfi_production_auth_e2e_tls_key
        target: ogfi_production_auth_e2e_tls_key
        mode: 0400

secrets:
  ogfi_production_auth_e2e_tls_cert:
    file: ${OGFI_PRODUCTION_AUTH_E2E_TLS_CERT_FILE:?Set the absolute per-run TLS certificate path}
  ogfi_production_auth_e2e_tls_key:
    file: ${OGFI_PRODUCTION_AUTH_E2E_TLS_KEY_FILE:?Set the absolute per-run TLS key path}
